<div class="mixer-section p-4 mb-4">
  <h5 class="mb-3">Recommendation Mixer</h5>
  <div class="row g-3">
    <div class="col-md-3">
      <label class="form-label d-flex justify-content-between">Mood <span id="mixer-mood-value" class="mixer-value">50</span></label>
      <input type="range" class="form-range" id="mixer-mood" min="0" max="100" value="50" disabled>
      <div class="d-flex justify-content-between text-secondary" style="font-size:.75rem">
        <span>Light</span><span>Dark</span>
      </div>
    </div>
    <div class="col-md-3">
      <label class="form-label d-flex justify-content-between">Energy <span id="mixer-energy-value" class="mixer-value">50</span></label>
      <input type="range" class="form-range" id="mixer-energy" min="0" max="100" value="50" disabled>
      <div class="d-flex justify-content-between text-secondary" style="font-size:.75rem">
        <span>Slow burn</span><span>Intense</span>
      </div>
    </div>
    <div class="col-md-3">
      <label class="form-label d-flex justify-content-between">Tension <span id="mixer-tension-value" class="mixer-value">50</span></label>
      <input type="range" class="form-range" id="mixer-tension" min="0" max="100" value="50" disabled>
      <div class="d-flex justify-content-between text-secondary" style="font-size:.75rem">
        <span>Relaxing</span><span>Suspenseful</span>
      </div>
    </div>
    <div class="col-md-3">
      <label class="form-label d-flex justify-content-between">Emotional Weight <span id="mixer-weight-value" class="mixer-value">50</span></label>
      <input type="range" class="form-range" id="mixer-weight" min="0" max="100" value="50" disabled>
      <div class="d-flex justify-content-between text-secondary" style="font-size:.75rem">
        <span>Light</span><span>Heavy</span>
      </div>
    </div>
  </div>
</div>

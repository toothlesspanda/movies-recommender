<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Movie Recommender</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>

  {% include 'partials/search.html' %}

  <div id="results" class="container-fluid px-4 pb-5 d-none">
    <div class="row g-3">
      <div class="col-lg-3 col-md-4">
        {% include 'partials/source_banner.html' %}
        {% include 'partials/mixer.html' %}
      </div>
      <div class="col-lg-9 col-md-8">
        {% include 'partials/related_grid.html' %}
      </div>
    </div>
  </div>

  <!-- Detail Modal -->
  <div class="modal fade" id="detailModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content bg-dark">
        <div class="modal-header border-secondary">
          <h5 class="modal-title" id="detail-title"></h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="d-flex gap-3">
            <img id="detail-poster" src="" alt="" class="detail-poster rounded flex-shrink-0">
            <div>
              <div id="detail-rating" class="text-warning mb-2"></div>
              <div id="detail-genres" class="mb-2"></div>
              <div id="detail-directors-row" class="mb-1">
                <small class="text-secondary">Director:</small>
                <small id="detail-directors"></small>
              </div>
              <div id="detail-actors-row" class="mb-2">
                <small class="text-secondary">Cast:</small>
                <small id="detail-actors"></small>
              </div>
              <p id="detail-description" class="text-secondary" style="font-size:.85rem"></p>
            </div>
          </div>
        </div>
        <div class="modal-footer border-secondary">
          <button type="button" id="detail-find-similar" class="btn btn-select-movie">Find similar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>

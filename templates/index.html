<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lucky Movie — Find movies like your favourites | Movie recommendations by mood</title>
  <meta name="description" content="Find movies like your favourites. Discover and get suggestions for similar films. We recommend movies by mood, genre, and emotion. Over 500,000 movies to explore.">
  <link rel="canonical" href="https://luckymovie.link/">
  <!-- Open Graph -->
  <meta property="og:title" content="Lucky Movie — Find movies like your favourites | Movie recommendations by mood">
  <meta property="og:description" content="Find movies like your favourites. Discover similar films by mood, genre, and emotion.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://luckymovie.link/">
  <!-- Twitter -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Lucky Movie — Find movies like your favourites | Movie recommendations by mood">
  <meta name="twitter:description" content="Find movies like your favourites. Discover similar films by mood, genre, and emotion.">
  <!-- Schema -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Lucky Movie",
    "url": "https://luckymovie.link",
    "description": "Discover movies based on what you already love. Search a film, tune your mood, and find your next favourite movie with AI-powered recommendations.",
    "applicationCategory": "Entertainment",
    "operatingSystem": "All",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
  }
  </script>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>

  {% include 'partials/search.html' %}

  <div id="results" class="container-fluid px-4 pb-5 d-none">
    <div class="row g-3">
      <div class="col-lg-3 col-md-4">
        {% include 'partials/source_banner.html' %}
        {% include 'partials/mixer.html' %}
      </div>
      <div class="col-lg-9 col-md-8">
        {% include 'partials/related_grid.html' %}
      </div>
    </div>
  </div>

  <footer class="site-footer text-center py-4 mt-5">
    <small class="d-block mb-2">© 2026 Lucky Movie</small>
    <small class="d-block mb-2" style="color:#e0e0e040">Powered by</small>
    <div class="d-flex justify-content-center align-items-center gap-3 mb-3">
      <a href="https://huggingface.co" target="_blank" rel="noopener"><img src="https://huggingface.co/datasets/huggingface/brand-assets/resolve/main/hf-logo.svg" alt="Hugging Face" height="18"></a>
      <a href="https://www.goatcounter.com" target="_blank" rel="noopener"><img src="https://www.vectorlogo.zone/logos/goatcounter/goatcounter-icon.svg" alt="GoatCounter" height="18"></a>
      <a href="https://www.hetzner.com" target="_blank" rel="noopener" class="footer-text-link">Hetzner</a>
      <a href="https://github.com/toothlesspanda/movies-recommender" target="_blank" rel="noopener"><svg height="18" viewBox="0 0 16 16" fill="#e0e0e080"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg></a>
    </div>
    <img src="https://www.themoviedb.org/assets/2/v4/logos/v2/blue_short-8e7b30f73a4020692ccca9c88bafe5dcb6f8a62a4c6bc55cd9ba82bb2cd95f6c.svg" alt="TMDB" height="12" class="mb-2 d-block mx-auto">
    <small>This product uses the TMDB API but is not endorsed or certified by TMDB.</small>
  </footer>

  <!-- Detail Modal -->
  <div class="modal fade" id="detailModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content bg-dark">
        <div class="modal-header border-secondary">
          <h5 class="modal-title" id="detail-title"></h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="d-flex gap-3">
            <img id="detail-poster" src="" alt="" class="detail-poster rounded flex-shrink-0">
            <div>
              <div id="detail-rating" class="text-warning mb-2"></div>
              <div id="detail-genres" class="mb-2"></div>
              <div id="detail-directors-row" class="mb-1">
                <small class="text-secondary">Director:</small>
                <small id="detail-directors"></small>
              </div>
              <div id="detail-actors-row" class="mb-2">
                <small class="text-secondary">Cast:</small>
                <small id="detail-actors"></small>
              </div>
              <p id="detail-description" class="text-secondary" style="font-size:.85rem"></p>
            </div>
          </div>
        </div>
        <div class="modal-footer border-secondary">
          <button type="button" id="detail-find-similar" class="btn btn-select-movie">Find similar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  <script data-goatcounter="https://toothlesspanda.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>

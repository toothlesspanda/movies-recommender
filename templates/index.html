<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lucky Movie — Find your next favourite film</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>

  {% include 'partials/search.html' %}

  <div id="results" class="container-fluid px-4 pb-5 d-none">
    <div class="row g-3">
      <div class="col-lg-3 col-md-4">
        {% include 'partials/source_banner.html' %}
        {% include 'partials/mixer.html' %}
      </div>
      <div class="col-lg-9 col-md-8">
        {% include 'partials/related_grid.html' %}
      </div>
    </div>
  </div>

  <footer class="site-footer text-center py-4 mt-5">
    <small class="d-block mb-2">© 2026 Lucky Movie</small>
    <small class="d-block mb-2" style="color:#e0e0e040">Powered by</small>
    <div class="d-flex justify-content-center align-items-center gap-3 mb-3">
      <a href="https://huggingface.co" target="_blank" rel="noopener"><img src="https://huggingface.co/datasets/huggingface/brand-assets/resolve/main/hf-logo.svg" alt="Hugging Face" height="18"></a>
      <a href="https://www.goatcounter.com" target="_blank" rel="noopener"><img src="https://www.vectorlogo.zone/logos/goatcounter/goatcounter-icon.svg" alt="GoatCounter" height="18"></a>
      <a href="https://www.hetzner.com" target="_blank" rel="noopener" class="footer-text-link">Hetzner</a>
    </div>
    <img src="https://www.themoviedb.org/assets/2/v4/logos/v2/blue_short-8e7b30f73a4020692ccca9c88bafe5dcb6f8a62a4c6bc55cd9ba82bb2cd95f6c.svg" alt="TMDB" height="12" class="mb-2 d-block mx-auto">
    <small>This product uses the TMDB API but is not endorsed or certified by TMDB.</small>
  </footer>

  <!-- Detail Modal -->
  <div class="modal fade" id="detailModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content bg-dark">
        <div class="modal-header border-secondary">
          <h5 class="modal-title" id="detail-title"></h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="d-flex gap-3">
            <img id="detail-poster" src="" alt="" class="detail-poster rounded flex-shrink-0">
            <div>
              <div id="detail-rating" class="text-warning mb-2"></div>
              <div id="detail-genres" class="mb-2"></div>
              <div id="detail-directors-row" class="mb-1">
                <small class="text-secondary">Director:</small>
                <small id="detail-directors"></small>
              </div>
              <div id="detail-actors-row" class="mb-2">
                <small class="text-secondary">Cast:</small>
                <small id="detail-actors"></small>
              </div>
              <p id="detail-description" class="text-secondary" style="font-size:.85rem"></p>
            </div>
          </div>
        </div>
        <div class="modal-footer border-secondary">
          <button type="button" id="detail-find-similar" class="btn btn-select-movie">Find similar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  <script data-goatcounter="https://toothlesspanda.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
